<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxel Top Down Test</title>
<style>
  html, body { margin: 0; height: 100%; background: #070a14; overflow: hidden; color: #dff3ff;
    font-family: system-ui, "Segoe UI", Tahoma, sans-serif; }
  canvas { display: block; touch-action: none; }
  #help { position: fixed; left: 16px; top: 14px; font-size: 14px; line-height: 1.6; opacity: .8; pointer-events: none; }
  #combo { position: fixed; right: 16px; top: 12px; font-size: 30px; font-weight: 800; color: #96d9f5; pointer-events: none; }
  #slash { position: fixed; right: 20px; bottom: 20px; width: 84px; height: 84px; border-radius: 50%;
    border: 2px solid #67b9e9; background: #142352cc; color: #fff; font-size: 15px; display: none; }
  @media (pointer: coarse) { #slash { display: block; } }
  #hud { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); font-size: 18px; font-weight: 700; white-space: nowrap; pointer-events: none; }
  #over { position: fixed; inset: 0; display: none; place-items: center; text-align: center; background: #070a14cc; }
  #over h1 { font-size: 40px; margin: 0 0 8px; color: #96d9f5; }
  @media (max-width: 560px) { #help { display: none; } #hud { font-size: 15px; } #combo { top: 40px; font-size: 22px; } }
  .pop { position: fixed; font-weight: 800; font-size: 26px; color: #fff; text-shadow: 0 0 10px #67b9e9;
    pointer-events: none; transform: translate(-50%, -50%); animation: rise .7s ease-out forwards; }
  @keyframes rise { to { opacity: 0; margin-top: -60px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="help">WASD หรือลูกศร: เดิน<br>Space หรือคลิก: ฟัน</div>
<div id="hud"></div>
<div id="over"><div><h1>แพ้แล้ว</h1><p id="final"></p><p>กด R หรือแตะเพื่อเล่นใหม่</p></div></div>
<div id="combo"></div>
<button id="slash">ฟัน</button>
<script type="module">
import * as THREE from 'three';
import { createBoss } from './boss_intro.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { loadIceMap } from './ice_map.js';

// Views: map (default, wide third person), ?view=top, ?view=follow.
const VIEW = new URLSearchParams(location.search).get('view') || 'map';
const MAP = VIEW === 'map';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a14);
scene.fog = new THREE.Fog(0x070a14, 12, 30);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 320);

scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x26325c, 3.2));
const sun = new THREE.DirectionalLight(0xd6e4ff, 3);
sun.position.set(-4, 8, 5);
scene.add(sun);

const world = MAP ? await loadIceMap(scene, renderer) : null;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.38, 0.4, 0.85);
if (MAP) { bloom.strength = 0.24; bloom.radius = 0.5; bloom.threshold = 0.9; }
composer.addPass(bloom);
composer.addPass(new OutputPass());

// Ground: one instanced mesh of slightly varied tiles.
{
  const n = 40, tile = 1;
  const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(tile, 0.2, tile),
    new THREE.MeshStandardMaterial({ roughness: 0.8 }), n * n);
  const m = new THREE.Matrix4(), c = new THREE.Color();
  for (let x = 0; x < n; x++) for (let z = 0; z < n; z++) {
    const i = x * n + z;
    m.setPosition(x - n / 2, -0.1 - ((x * 7 + z * 13) % 3) * 0.01, z - n / 2);
    mesh.setMatrixAt(i, m);
    mesh.setColorAt(i, c.set((x + z) % 2 ? 0x18213f : 0x141b35));
  }
  if (!MAP) scene.add(mesh);
}

const box = (w, h, d, color, y = 0, x = 0, z = 0) => {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: 0.7 }));
  b.position.set(x, y, z);
  return b;
};

// Placeholder voxel character. Forward is -Z.
const player = new THREE.Group();
const body = new THREE.Group();
player.add(body);
scene.add(player);
const DARK = 0x1b2340, MID = 0x2c477d, SKIN = 0xcfd9ea;
body.add(box(0.62, 0.72, 0.34, MID, 1.08));
const head = box(0.44, 0.44, 0.44, SKIN, 1.68);
head.add(box(0.09, 0.09, 0.02, 0x142352, 0.03, -0.1, -0.225), box(0.09, 0.09, 0.02, 0x142352, 0.03, 0.1, -0.225));
body.add(head);
const limb = (x, y, w, h, color) => {
  const pivot = new THREE.Group();
  pivot.position.set(x, y, 0);
  pivot.add(box(w, h, w, color, -h / 2));
  body.add(pivot);
  return pivot;
};
const legL = limb(-0.17, 0.72, 0.26, 0.72, DARK), legR = limb(0.17, 0.72, 0.26, 0.72, DARK);
const armL = limb(-0.42, 1.38, 0.2, 0.62, MID);

// Right arm hangs from a chest pivot, so the whole swing is one rotation.
const swing = new THREE.Group();
swing.position.y = 1.38;
body.add(swing);
const armR = new THREE.Group();
armR.position.x = 0.42;
armR.add(box(0.2, 0.62, 0.2, MID, -0.31));
swing.add(armR);
const holder = new THREE.Group();   // the hand_R attachment point
holder.position.y = -0.62;
armR.add(holder);

const tipPoint = new THREE.Object3D(), innerPoint = new THREE.Object3D();
const pulse = { value: -0.4 };

new GLTFLoader().load('assets/voxel_weapon.glb', (gltf) => {
  const weapon = gltf.scene;
  weapon.traverse((o) => {
    if (!o.isMesh) return;
    // Blender stored the pulse route in the second UV set.
    o.geometry.setAttribute('aPulse', o.geometry.attributes.uv1 ?? o.geometry.attributes.uv);
    o.material.onBeforeCompile = (s) => {
      s.uniforms.uHead = pulse;
      s.vertexShader = 'attribute vec2 aPulse;\nvarying float vPulse;\n' +
        s.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvPulse = aPulse.x;');
      s.fragmentShader = 'uniform float uHead;\nvarying float vPulse;\n' +
        s.fragmentShader.replace('#include <emissivemap_fragment>',
          `#include <emissivemap_fragment>
           float pz = (vPulse - uHead) / 0.13;
           totalEmissiveRadiance *= 1.0 + 7.0 * exp(-pz * pz);`);
    };
  });
  weapon.scale.setScalar(1);
  weapon.position.y = 0.1;   // the right grip sits just below the middle of the shaft
  tipPoint.position.set(-0.72, 0.33, 0);
  innerPoint.position.set(-0.66, 0.47, 0);
  weapon.add(tipPoint, innerPoint);
  holder.add(weapon);
  ready = true;
}, undefined, () => {
  document.getElementById('help').textContent = 'โหลดเคียวไม่สำเร็จ: ต้องเปิดผ่านเซิร์ฟเวอร์ ไม่ใช่เปิดไฟล์ตรงๆ';
});

// Crystal wings from Blender (voxel-wings/build_wings.py). Press T to change tier.
let wings = null;
const WING_TIERS = [[/Frame|Primary/, 1], [/Secondary|Core|Gem/, 2], [/Covert|Shard/, 3]];
const PULSE_POWER = [0, 0, 0.45, 0.8, 1.25];
const WING_IDLE_FOLD = 0.6;   // 1 is fully folded, 0 fully open
function setWingTier(tier) {
  wings.tier = tier;
  wings.model.traverse((o) => {
    for (const [pattern, need] of WING_TIERS) if (pattern.test(o.name)) o.visible = tier >= need;
  });
}
function loadWings(bone) {
  // Measured at rest, before clips start: wings are built in the character's model space.
  const fromBone = bone.matrixWorld.clone().invert().multiply(player.matrixWorld);
  const wingFile = new URLSearchParams(location.search).get('wing') === 'slim' ? 'voxel_wings_slim' : 'voxel_wings';
  new GLTFLoader().load(`assets/${wingFile}.glb?t=${Date.now()}`, (gltf) => {
    const seat = new THREE.Group();
    seat.applyMatrix4(fromBone);
    // Scale around the point where the wings meet the back, so they stay attached.
    const WING_SCALE = 0.62;
    gltf.scene.scale.setScalar(WING_SCALE);
    gltf.scene.position.set(0, 0.98 * (1 - WING_SCALE), 0.42 * (1 - WING_SCALE));
    seat.add(gltf.scene);
    bone.add(seat);
    const mixer = new THREE.AnimationMixer(gltf.scene);
    mixer.clipAction(new THREE.AnimationClip('Wings', -1, gltf.animations.flatMap((a) => a.tracks))).play();
    const tips = [];
    gltf.scene.traverse((o) => { if (/^Tip[RL]/.test(o.name)) tips.push(o); });
    // Pulse: a band of light runs out from the core through every feather.
    const pulse = { uHead: { value: 0 }, uCenter: { value: new THREE.Vector3() }, uPower: { value: 0 } };
    const seen = new Set();
    gltf.scene.traverse((o) => {
      if (!o.isMesh) return;
      for (const m of [o.material].flat()) {
        if (seen.has(m)) continue;
        seen.add(m);
        m.onBeforeCompile = (shader) => {
          Object.assign(shader.uniforms, pulse);
          shader.vertexShader = 'varying vec3 vWingPos;\n' + shader.vertexShader.replace('#include <begin_vertex>',
            '#include <begin_vertex>\nvWingPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
          shader.fragmentShader = 'uniform float uHead; uniform float uPower; uniform vec3 uCenter; varying vec3 vWingPos;\n' +
            shader.fragmentShader.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
              float wingBand = (distance(vWingPos, uCenter) - uHead) / 0.34;
              totalEmissiveRadiance += diffuseColor.rgb * uPower * exp(-wingBand * wingBand);`);
        };
        m.needsUpdate = true;
      }
    });
    wings = { model: gltf.scene, mixer, tips, tier: 4, spark: 0, pulse, fold: 1, time: 0,
      core: gltf.scene.getObjectByName('Core'), foldR: gltf.scene.getObjectByName('FoldR'), foldL: gltf.scene.getObjectByName('FoldL') };
    setWingTier(4);
  });
}
function updateWings(dt, moving) {
  wings.mixer.update(dt * (moving ? 2.1 : 1));
  wings.time += dt;
  // Folded against the back at rest; open when moving, jumping, or attacking.
  const open = moving || airborne || attack >= 0;
  wings.fold += ((open ? 0 : WING_IDLE_FOLD) - wings.fold) * (1 - Math.exp(-(open ? 11 : 5) * dt));
  for (const [node, side] of [[wings.foldR, 1], [wings.foldL, -1]]) {
    node.rotation.set(0, -side * 1.18 * wings.fold, -side * 0.34 * wings.fold);
    node.scale.setScalar(1 - wings.fold * 0.2);
  }
  const { pulse } = wings;
  wings.core.getWorldPosition(pulse.uCenter.value);
  pulse.uHead.value = (wings.time % 2.2) / 2.2 * 2.4 - 0.2;
  pulse.uPower.value = PULSE_POWER[wings.tier];
  if (wings.tier < 3 || wings.fold > 0.5) return;
  wings.spark -= dt;
  if (wings.spark > 0) return;
  wings.spark = wings.tier === 4 ? 0.018 : 0.06;
  // Sparkles flow off the feather tips and trail behind the character.
  const at = wings.tips[Math.floor(Math.random() * wings.tips.length)].getWorldPosition(new THREE.Vector3());
  const drift = velocity.clone().multiplyScalar(-0.42);
  drift.y = -0.5 - Math.random() * 0.45;
  drift.x += (Math.random() - 0.5) * 0.3; drift.z += (Math.random() - 0.5) * 0.3;
  spawn(at, drift, 0.85, 0.035 + Math.random() * 0.05);
}

// Rigged character: clips come from Blender, and the weapon rides the socket bone.
let mixer = null, rigged = false, currentClip = null;
const clips = {};
function playClip(name, fade = 0.14) {
  const next = clips[name];
  if (!next || currentClip === next) return;
  next.reset().setEffectiveWeight(1).fadeIn(fade).play();
  if (currentClip) currentClip.fadeOut(fade);
  currentClip = next;
}
const gripR = new THREE.Object3D(), gripL = new THREE.Object3D();
gripL.position.y = -0.45;   // the left hand sits lower on the shaft
holder.add(gripR, gripL);
let arms = [], lean = null;
// ?char=reaper loads the armoured character; the block character is the default.
const CHARACTER = { reaper: 'assets/voxel_character_rigged.glb', block: 'assets/voxel_block_rigged.glb' }[new URLSearchParams(location.search).get('char')]
  || 'assets/voxel_modular_rigged.glb';
let floatingHands = [], leftGrip = 0, reach = 2.7;
new GLTFLoader().load(`${CHARACTER}?t=${Date.now()}`, (gltf) => {  // never reuse a cached model
  body.clear();
  lean = new THREE.Group();   // leans the whole body into movement and turns
  body.add(lean);
  lean.add(gltf.scene);
  gltf.scene.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  body.updateMatrixWorld(true);
  const get = (n) => gltf.scene.getObjectByName(n);
  if (get('Hood')) loadWings(get('Body'));
  const socket = get('Weapon');
  // Export can change a bone's rest rotation, so cancel it instead of guessing an offset.
  const align = new THREE.Group();
  socket.add(align);
  align.quaternion.copy(socket.getWorldQuaternion(new THREE.Quaternion()).invert()
    .multiply(player.getWorldQuaternion(new THREE.Quaternion())));
  align.add(holder);
  holder.position.set(0, 0, 0);
  holder.rotation.set(0, 0, 0);
  const arm = (side, grip, pole) => {
    const upper = get(`Arm${side}`), fore = get(`Fore${side}`), hand = get(`Hand_${side}`);
    const s = upper.getWorldPosition(new THREE.Vector3()), e = fore.getWorldPosition(new THREE.Vector3());
    const h = hand.getWorldPosition(new THREE.Vector3());
    return { upper, fore, hand, grip, pole, l1: s.distanceTo(e), l2: e.distanceTo(h),
      restU: upper.quaternion.clone(), restF: fore.quaternion.clone() };
  };
  if (get('ArmR')) {
    arms = [arm('R', gripR, new THREE.Vector3(0.8, -0.6, 0.2)), arm('L', gripL, new THREE.Vector3(-0.8, -0.6, 0.2))];
  } else {
    // No arms: floating hands simply sit on the grips.
    floatingHands = [[get('Hand_R'), gripR], [get('Hand_L'), gripL]];
    holder.scale.setScalar(1.25);
    reach = 3.2;   // the bigger scythe reaches further
  }
  mixer = new THREE.AnimationMixer(gltf.scene);
  for (const clip of gltf.animations) clips[clip.name] = mixer.clipAction(clip);
  for (const [name, action] of Object.entries(clips)) {
    if (!/^(Slash|Cast)/.test(name)) continue;
    action.setLoop(THREE.LoopOnce, 1);
    action.clampWhenFinished = true;
    action.timeScale = name.startsWith('Slash') ? 1.15 : 1;
  }
  const spring = (name, gain, stiff, limit, keyed = false) => ({ node: get(name), gain, stiff, limit, keyed,
    rest: get(name).quaternion.clone(),
    damp: 2 * Math.sqrt(stiff) * 0.8, last: null, drag: new THREE.Vector2(), target: new THREE.Vector2(),
    tilt: new THREE.Vector2(), speed: new THREE.Vector2() });
  springs = [
    ...['SkirtF', 'SkirtB', 'SkirtR', 'SkirtL', 'Cape'].filter(get).map((n) => spring(n, 0.08, 45, 0.5)),
    spring('PadR', 0.02, 120, 0.2), spring('PadL', 0.02, 120, 0.2),
    spring('Head', 0.01, 110, 0.12, true), spring('Weapon', 0.012, 90, 0.14, true),
  ];
  rigged = true;
  playClip('Idle', 0);
});

// Secondary motion: each part is a damped spring that tips away from how it is moving.
let springs = [];
const sP = new THREE.Vector3(), sAxis = new THREE.Vector3(), sQ = new THREE.Quaternion();
const sW = new THREE.Quaternion(), sPar = new THREE.Quaternion();
function updateSprings(dt) {
  player.updateWorldMatrix(true, true);
  // Parts without keys are not reset by the mixer, so reset them or rotation accumulates.
  for (const p of springs) if (!p.keyed) p.node.quaternion.copy(p.rest);
  player.updateWorldMatrix(true, true);
  for (const p of springs) {
    p.node.getWorldPosition(sP);
    if (!p.last) p.last = sP.clone();
    const inv = 1 / Math.max(dt, 1 / 240);
    const vx = THREE.MathUtils.clamp((sP.x - p.last.x) * inv, -7, 7);
    const vz = THREE.MathUtils.clamp((sP.z - p.last.z) * inv, -7, 7);
    p.last.copy(sP);
    // Low-pass the motion first: raw per-frame speed carries the walk bounce and frame jitter.
    const filter = 1 - Math.exp(-dt / 0.11);
    p.drag.x += (vx - p.drag.x) * filter;
    p.drag.y += (vz - p.drag.y) * filter;
    p.target.set(-p.drag.x * p.gain, -p.drag.y * p.gain).clampLength(0, p.limit);
    // Near-critical damping, in small fixed steps so frame rate cannot make it ring.
    const steps = Math.max(1, Math.ceil(dt * 240)), h = dt / steps;
    for (let n = 0; n < steps; n++) {
      p.speed.x += ((p.target.x - p.tilt.x) * p.stiff - p.speed.x * p.damp) * h;
      p.speed.y += ((p.target.y - p.tilt.y) * p.stiff - p.speed.y * p.damp) * h;
      p.tilt.addScaledVector(p.speed, h);
    }
    const amount = p.tilt.length();
    if (amount < 1e-4) continue;
    // A part dragged toward +x tips about the axis up x drag.
    sAxis.set(p.tilt.y, 0, -p.tilt.x).normalize();
    sQ.setFromAxisAngle(sAxis, amount);
    p.node.getWorldQuaternion(sW);
    p.node.parent.getWorldQuaternion(sPar).invert();
    p.node.quaternion.copy(sPar.multiply(sQ).multiply(sW));
    p.node.updateWorldMatrix(false, true);
  }
}

// Two-bone IK: hands follow the grips, so they stay on the shaft through any swing.
const vS = new THREE.Vector3(), vE = new THREE.Vector3(), vH = new THREE.Vector3(), vT = new THREE.Vector3();
const vD = new THREE.Vector3(), vP = new THREE.Vector3(), vA = new THREE.Vector3(), vB = new THREE.Vector3();
const qW = new THREE.Quaternion(), qP = new THREE.Quaternion(), qD = new THREE.Quaternion();
function turnWorld(obj, from, to) {
  qD.setFromUnitVectors(vA.copy(from).normalize(), vB.copy(to).normalize());
  obj.getWorldQuaternion(qW);
  obj.parent.getWorldQuaternion(qP).invert();
  obj.quaternion.copy(qP.multiply(qD).multiply(qW));
  obj.updateWorldMatrix(false, true);
}
function solveArms() {
  player.updateWorldMatrix(true, true);
  // The right hand keeps the weapon; the left joins the shaft only while attacking.
  leftGrip += ((attack >= 0 ? 1 : 0) - leftGrip) * 0.22;
  floatingHands.forEach(([hand, grip], i) => {
    const onGrip = hand.parent.worldToLocal(grip.getWorldPosition(vT));
    hand.position.lerp(onGrip, i === 0 ? 1 : leftGrip);
  });
  for (const a of arms) {
    a.upper.quaternion.copy(a.restU); a.fore.quaternion.copy(a.restF);
    a.upper.updateWorldMatrix(false, true);
    a.upper.getWorldPosition(vS); a.fore.getWorldPosition(vE);
    a.grip.getWorldPosition(vT);
    const reach = a.l1 + a.l2 - 0.005;
    vD.copy(vT).sub(vS);
    let d = vD.length();
    if (d > reach) { vD.multiplyScalar(reach / d); vT.copy(vS).add(vD); d = reach; }
    vD.normalize();
    vP.copy(a.pole).applyQuaternion(player.quaternion);
    vP.addScaledVector(vD, -vP.dot(vD)).normalize();
    const along = (a.l1 * a.l1 - a.l2 * a.l2 + d * d) / (2 * d);
    const out = Math.sqrt(Math.max(a.l1 * a.l1 - along * along, 0));
    const elbow = vS.clone().addScaledVector(vD, along).addScaledVector(vP, out);
    turnWorld(a.upper, vE.clone().sub(vS), elbow.clone().sub(vS));
    a.fore.getWorldPosition(vE); a.hand.getWorldPosition(vH);
    turnWorld(a.fore, vH.clone().sub(vE), vT.clone().sub(vE));
  }
}

// Enemies: voxel creatures that walk at the player.
const enemies = [];
function addEnemy(wave) {
  const big = wave >= 3 && Math.random() < 0.25;
  const g = new THREE.Group();
  const size = big ? 1.25 : 0.8;
  const shell = box(size, size, size, big ? 0x6b2f7a : 0x3f4f8f, size / 2);
  shell.add(box(size * 0.16, size * 0.16, 0.03, 0xffffff, size * 0.14, -size * 0.2, -size / 2 - 0.01),
    box(size * 0.16, size * 0.16, 0.03, 0xffffff, size * 0.14, size * 0.2, -size / 2 - 0.01));
  g.add(shell);
  const angle = Math.random() * Math.PI * 2;
  g.position.set(player.position.x + Math.cos(angle) * 11, 0, player.position.z + Math.sin(angle) * 11);
  if (MAP) { const r = 5 + Math.random() * 7; g.position.set(world.arena.x + Math.cos(angle) * r, world.arena.top, world.arena.z + Math.sin(angle) * r); }
  scene.add(g);
  enemies.push({ g, shell, hp: big ? 3 : 1, speed: (big ? 1.3 : 1.9) + wave * 0.12, score: big ? 30 : 10,
    radius: size * 0.5, knock: new THREE.Vector3(), flash: 0, hop: Math.random() * 6 });
}

// Cube particles: one pool, one draw call.
const MAX = 320;
const cubes = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshBasicMaterial({ color: new THREE.Color(0.55, 1.3, 1.9), toneMapped: false }), MAX);
cubes.frustumCulled = false;
scene.add(cubes);
const parts = Array.from({ length: MAX }, () => ({ p: new THREE.Vector3(), v: new THREE.Vector3(), life: 0, max: 1, size: 0.05 }));
let nextPart = 0;
let boss = null;
function spawn(p, v, life, size) {
  const a = parts[nextPart++ % MAX];
  a.p.copy(p); a.v.copy(v); a.life = a.max = life; a.size = size;
}

// Expanding shockwave ring on the ground.
const ringMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0.6, 1.4, 2.0), transparent: true,

function checkHit() {
  const forward = new THREE.Vector3(-Math.sin(player.rotation.y), 0, -Math.cos(player.rotation.y));
  let landed = 0;
  for (const e of [...enemies]) {
    const to = e.g.position.clone().sub(player.position).setY(0);
    if (to.length() > reach + e.radius || to.clone().normalize().dot(forward) < COMBO[step].reach) continue;
    landed++;
    e.hp--; e.flash = 1;
    e.knock.copy(to.normalize()).multiplyScalar(11);
    const at = e.g.position.clone().setY(0.6);
    burst(at, e.hp > 0 ? 14 : 30);
    if (e.hp <= 0) {
      combo = comboTimer > 0 ? combo + 1 : 1;
      comboTimer = 1.8;
      const mult = 1 + (combo - 1) * 0.2;
      const gain = Math.round(e.score * mult);
      score += gain; kills++;
      pop(combo > 1 ? `+${gain} x${mult.toFixed(1)}` : `+${gain}`, at.clone().setY(1.8));
      scene.remove(e.g);
      enemies.splice(enemies.indexOf(e), 1);
    }
    ring.position.x = at.x; ring.position.z = at.z;
    ringAge = 0;
  }

}

      if (queued && attack >= WINDUP + CUT + 0.04 && step < 2) startStep(step + 1);

    } else if (attack < WINDUP + CUT) {

function update(dt) {

    if (chase && !enemies.includes(chase)) { chase = null; moveTo = null; }
    if (chase) moveTo = chase.g.position;
    if (moveTo) {
      const gap = player.position.distanceTo(vMove.copy(moveTo).setY(0));
      if (chase && gap < reach - 0.6) {
        facing = Math.atan2(-(moveTo.x - player.position.x), -(moveTo.z - player.position.z));
        heading.set(0, 0, 0);

      } else if (gap < 0.15) {
        moveTo = null;

        heading.copy(vMove).sub(player.position).setY(0);
      }
    }
  }
  if (MAP) heading.applyAxisAngle(UP, camYaw);   // walk relative to the camera
  if (over) heading.set(0, 0, 0);
  const moving = heading.lengthSq() > 0;
  if (moving) {
    heading.normalize();
    facing = Math.atan2(-heading.x, -heading.z);
    walk += dt * 11;
  }
  // Ease speed and turning: most of the smooth feel lives here, not in the clips.
  const top = attack >= 0 ? 1.4 : 4.2;
  velocity.lerp(heading.multiplyScalar(top), 1 - Math.exp(-(moving ? 12 : 16) * dt));
  if (MAP) {
    const p = player.position, nx = p.x + velocity.x * dt, nz = p.z + velocity.z * dt;
    if (world.canStand(nx, p.z, p.y)) p.x = nx; else velocity.x = 0;
    if (world.canStand(p.x, nz, p.y)) p.z = nz; else velocity.z = 0;
    const h = world.groundAt(p.x, p.z) ?? p.y;
    if (airborne) {
      fallSpeed -= 27 * dt;
      p.y += fallSpeed * dt;
      if (p.y <= h) {
        p.y = h; airborne = false; fallSpeed = 0; shake = Math.max(shake, 0.05);
        burst(p.clone().setY(h + 0.15), 8);
      }
    } else if (p.y - h > 0.8) {
      airborne = true;                                            // walked off a higher ledge
    } else {
      p.y += (h - p.y) * (1 - Math.exp(-18 * dt));                // ease over stair steps
    }
  } else {
    player.position.addScaledVector(velocity, dt).clampLength(0, 17);
  }
  const turn = Math.atan2(Math.sin(facing - player.rotation.y), Math.cos(facing - player.rotation.y));
  player.rotation.y += turn * (1 - Math.exp(-16 * dt));
  if (rigged) {
    if (attack < 0) playClip(airborne && clips.Jump ? 'Jump' : velocity.length() > 0.5 ? 'Walk' : 'Idle', airborne ? 0.08 : 0.14);
    clips.Walk.timeScale = Math.max(velocity.length() / 3.6, 0.5);
    mixer.update(dt);

    const side = velocity.dot(rightOf.set(Math.cos(player.rotation.y), 0, -Math.sin(player.rotation.y)));

  animateAttack(dt);
  pulse.value += dt * 1.1;
  if (pulse.value > 2.6) pulse.value = -0.4;

  hurt -= dt;
  for (const e of enemies) {
    const to = player.position.clone().sub(e.g.position).setY(0);
    const dist = to.length();
    to.normalize();
    const ox = e.g.position.x, oz = e.g.position.z;
    e.g.position.addScaledVector(to, e.speed * dt).addScaledVector(e.knock, dt);
    if (MAP) {   // enemies stay on solid ground
      const h = world.groundAt(e.g.position.x, e.g.position.z);
      if (h === null || Math.abs(h - e.g.position.y) > 1.3) { e.g.position.x = ox; e.g.position.z = oz; } else e.g.position.y = h;
    }
    e.knock.multiplyScalar(Math.exp(-8 * dt));
    e.g.rotation.y = Math.atan2(-to.x, -to.z);
    e.hop += dt * 9;
    e.shell.position.y = e.radius + Math.abs(Math.sin(e.hop)) * 0.22;
    e.flash = Math.max(0, e.flash - dt * 6);
    e.shell.material.emissive.setRGB(e.flash * 2, e.flash * 3, e.flash * 4);
    if (dist < 0.75 + e.radius && hurt <= 0 && !over) {
      hp--; hurt = 0.9; shake = 0.3;
      e.knock.copy(to).multiplyScalar(-9);
      if (hp <= 0) endGame();
    }
  }
  if (!enemies.length && !over) {
    wave++;
    for (let i = 0; i < 2 + wave * 2; i++) addEnemy(wave);
    if (wave > 1) pop(`เวฟ ${wave}`, player.position.clone().setY(3));
  }
  body.visible = hurt < 0.6 || Math.floor(hurt * 16) % 2 === 0;

  ringAge += dt;
  const rk = Math.min(ringAge / 0.4, 1);
  ring.scale.setScalar(0.3 + 3 * ease(rk));
  ringMat.opacity = 1 - rk;

  comboTimer -= dt;
  document.getElementById('hud').textContent = `เลือด ${'■'.repeat(Math.max(hp, 0))}   คะแนน ${score}   เวฟ ${wave}   ${cooldownText()}`;
  document.getElementById('combo').textContent = comboTimer > 0 && combo > 1 ? `คอมโบ ${combo}` : '';

  idleSpark -= dt;
  if (ready && idleSpark < 0) {
    idleSpark = 0.09;
    tipPoint.getWorldPosition(a).lerp(innerPoint.getWorldPosition(b), Math.random());
    spawn(a, b.set((Math.random() - 0.5) * 0.3, 0.9, (Math.random() - 0.5) * 0.3), 0.7, 0.03);
  }
  if (MAP) world.update(dt, player.position);
  runFx(dt);
  updateTrail(dt);
  updateParts(dt);
}

const ICE = [0x101a44, 0x20397a, 0x3e6cc0, 0x62aee8, 0x9ad9f7, 0xffffff].map((c) => new THREE.Color(c));
const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
const cM = new THREE.Matrix4(), cS = new THREE.Vector3(), cP = new THREE.Vector3(), cQ = new THREE.Quaternion();
function voxelCloud(items, glowLevel = 0.8) {
  const material = new THREE.MeshStandardMaterial({ roughness: 0.55, emissive: 0x16356e, emissiveIntensity: glowLevel });
  const mesh = new THREE.InstancedMesh(cubeGeometry, material, items.length);
  mesh.frustumCulled = false;
  items.forEach((item, n) => mesh.setColorAt(n, ICE[item.c]));
  const apply = (fn) => {
    items.forEach((item, n) => {
      cP.copy(item.p);
      const size = fn(item, cP);
      cM.compose(cP, cQ, cS.setScalar(Math.max(size, 0.0001)));

    });
    mesh.instanceMatrix.needsUpdate = true;
  };

  const clip = new THREE.AnimationClip('FrostCrescent', -1, gltf.animations.flatMap((a) => a.tracks));
  const action = mixer.clipAction(clip);
  action.setLoop(THREE.LoopOnce, 1);

function frostCrescent() {
  if (!crescent) return;
  const { model, mixer, action, length } = crescent;
  const dir = facingDir(), start = player.position.clone().addScaledVector(dir, 1.5);
  start.y += 0.25;
  model.rotation.y = player.rotation.y;
  model.position.copy(start);
  let wait = WINDUP;               // the wave leaves on the swing, not on the key press
  // Accents from voxel-vfx/vfx-timing.md: a brief speed flash, then a fading ground mark.
  const speed = flatLayer('speed', 7, 3.2, 0.32), trail = flatLayer('trail', 7, 15, 0.3);
  speed.geometry.rotateY(-Math.PI / 2);
  speed.position.set(0, 0.8, 0.6);   // just behind the wave, clear of the player
  model.add(speed);
  trail.position.copy(player.position).addScaledVector(dir, 8);
  trail.position.y += 0.07;
  trail.rotation.y = player.rotation.y;
  scene.add(trail);
  fx.push(fadeOut(trail, 0.7, 1, 0.7));
  const struck = new Set();
  let t = 0;
  fx.push((dt) => {
    if (wait > 0) {
      wait -= dt;
      if (wait <= 0) { model.visible = true; action.reset().play(); }
      return true;
    }
    t += dt;
    mixer.update(dt);
    const k = t / length;
    speed.material.opacity = t < 0.15 ? Math.sin(Math.PI * t / 0.15) : 0;
    model.position.copy(start).addScaledVector(dir, (1 - (1 - Math.min(k, 1)) ** 2.2) * 14);
    for (const e of [...enemies]) {
      if (!struck.has(e) && Math.hypot(e.g.position.x - model.position.x, e.g.position.z - model.position.z) < 4) { struck.add(e); damage(e, player.position, 12); shake = 0.14; }
    }
    if (k < 1) return true;
    model.visible = false;
    model.remove(speed);

    return false;
  });
}
function fadeOut(mesh, life, peak, delay = 0) {
  let t = -delay;
  return (dt) => {
    t += dt;
    if (t < 0) return true;
    mesh.material.opacity = peak * Math.min(t / 0.12, 1) * Math.max(0, 1 - t / life);
    if (t < life) return true;
    scene.remove(mesh);
    activeLayers.delete(mesh);
    return false;
  };
}

// Sculpted and keyframed in Blender (voxel-vfx/build_blizzard_vortex.py), played as real 3D.
let vortex = null;
new GLTFLoader().load(`assets/vfx_blizzard_vortex.glb?t=${Date.now()}`, (gltf) => {
  gltf.scene.visible = false;
  scene.add(gltf.scene);
  const mixer = new THREE.AnimationMixer(gltf.scene);
  const clip = new THREE.AnimationClip('BlizzardVortex', -1, gltf.animations.flatMap((a) => a.tracks));
  const action = mixer.clipAction(clip);
  action.setLoop(THREE.LoopOnce, 1);
  action.clampWhenFinished = true;
  vortex = { model: gltf.scene, mixer, action, length: clip.duration };
});
function blizzardVortex() {
  if (!vortex) return;
  const { model, mixer, action, length } = vortex;
  const centre = player.position.clone().addScaledVector(facingDir(), 4.5);
  model.position.copy(centre);
  model.visible = true;
  action.reset().play();
  // Accents from voxel-vfx/vfx-timing.md: seal at the start, two wind flashes, a mark at the end.
  const seal = flatLayer('seal', 11, 11, 0.45), wind = flatLayer('wind_ring', 11, 11, 0.3), mark = flatLayer('frost_mark', 12, 12, 0.25);
  seal.position.y = 0.1; wind.position.y = 1.7; mark.position.y = 0.06;
  const layers = [seal, wind, mark];
  layers.forEach((m) => { m.position.add(centre); scene.add(m); });
  let t = 0, tick = 0.4;
  fx.push((dt) => {
    t += dt;
    mixer.update(dt);
    const flash = (at, life) => (t >= at && t < at + life ? Math.sin(Math.PI * (t - at) / life) : 0);
    seal.material.opacity = t < 0.35 ? Math.sin(Math.PI * t / 0.35) : 0;
    wind.material.opacity = flash(0.9, 0.18) + flash(1.6, 0.18);
    mark.material.opacity = t > 2.35 ? Math.min((t - 2.35) / 0.1, 1) * Math.max((length - t) / 0.35, 0) : 0;
    seal.rotation.y += dt * 0.8;
    wind.rotation.y -= dt * 4.5;
    tick -= dt;
    for (const e of [...enemies]) {
      const to = centre.clone().sub(e.g.position).setY(0);
      if (to.length() < 5.2) {
        e.g.position.addScaledVector(to.normalize(), dt * 4);
        if (tick <= 0) damage(e, centre, 0);
      }
    }
    if (tick <= 0) tick = 0.55;
    if (t < length) return true;
    model.visible = false;
    scene.remove(...layers);
    layers.forEach((m) => activeLayers.delete(m));
    return false;
  });
}

// Sculpted and keyframed in Blender (voxel-vfx/build_winter_eclipse.py), played as real 3D.
let eclipse = null;
new GLTFLoader().load(`assets/vfx_winter_eclipse.glb?t=${Date.now()}`, (gltf) => {
  gltf.scene.visible = false;
  scene.add(gltf.scene);
  const mixer = new THREE.AnimationMixer(gltf.scene);
  const clip = new THREE.AnimationClip('WinterEclipse', -1, gltf.animations.flatMap((a) => a.tracks));
  const action = mixer.clipAction(clip);
  action.setLoop(THREE.LoopOnce, 1);
  action.clampWhenFinished = true;
  eclipse = { model: gltf.scene, mixer, action, length: clip.duration };
});
function winterEclipse() {
  if (!eclipse) return;
  const IMPACT = 33 / 24;
  const { model, mixer, action, length } = eclipse;
  const centre = player.position.clone().addScaledVector(facingDir(), 3);
  model.position.copy(centre);
  model.visible = true;
  action.reset().play();
  // The ultimate's only 2D: a short anime hit at impact, then a crack left on the ground.
  const star = faceLayer('star', 9, 0.9), shock = flatLayer('shock', 8, 8, 0.65), crack = flatLayer('crack', 11, 11, 0.5);
  const impactLayers = [star, shock, crack];
  impactLayers.forEach((m) => { m.visible = true; activeLayers.delete(m); m.position.copy(centre); scene.add(m); });
  star.position.y += 2.2; shock.position.y += 0.34; crack.position.y += 0.2;
  let t = 0, landed = false;
  fx.push((dt) => {
    t += dt;
    mixer.update(dt);
    dimmer.style.background = t < IMPACT ? '#02040e' : '#bfe8ff';
    dimmer.style.opacity = t < IMPACT ? Math.min(t / 0.45, 1) * 0.62 : Math.max(0, 0.22 * (1 - (t - IMPACT) / 0.16));
    if (t >= IMPACT && !landed) {
      landed = true;
      stop = 0.12; shake = 0.55;
      for (const e of [...enemies]) if (e.g.position.distanceTo(centre) < 6.5) { damage(e, centre, 16); if (enemies.includes(e)) damage(e, centre, 16); }
    }
    if (landed) {
      const age = t - IMPACT;
      star.material.opacity = Math.max(0, 1 - age / 0.18);
      shock.material.opacity = Math.max(0, 0.9 - age / 0.5);
      shock.scale.setScalar(1 + age * 4);
      crack.material.opacity = Math.min(age / 0.08, 1) * Math.min(Math.max((length - t) / 0.4, 0), 1);
    }
    if (t < length) return true;
    model.visible = false;
    scene.remove(...impactLayers);
    dimmer.style.opacity = 0;
    return false;
  });
}

function castSkill(n) {
  // [effect, cooldown, combo entry, delay until the effect starts]
  const skill = { 1: [frostCrescent, 1.4, 0, 0], 2: [blizzardVortex, 7, 3, 9 / 24], 3: [winterEclipse, 14, 4, 0] }[n];
  if (!skill || !ready || over || cooldown[n] > 0) return;
  cooldown[n] = skill[1];
  startStep(skill[2]);
  let wait = skill[3];                  // Vortex starts when the scythe is planted
  fx.push((dt) => {
    wait -= dt;
    if (wait > 0) return true;
    skill[0]();
    return false;
  });
}

function runFx(dt) {
  for (const n of [1, 2, 3]) cooldown[n] = Math.max(0, cooldown[n] - dt);
  for (let i = fx.length - 1; i >= 0; i--) if (!fx[i](dt)) fx.splice(i, 1);
}

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 0.8 ? 62 : (TOP ? 36 : MAP ? 50 : 45);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

if (MAP) {
  player.position.copy(world.spawn);
  follow0();
  document.getElementById('help').innerHTML = 'WASD: เดิน<br>Space: กระโดด<br>กดเมาส์ขวาลาก: หมุนกล้อง<br>ลูกกลิ้ง: ซูม<br>คลิก: ฟัน<br>1, 2, 3: สกิล<br>V: เปิดปิดชั้น 2D<br>T: ระดับปีก';
  addEventListener('contextmenu', (e) => e.preventDefault());
  addEventListener('pointermove', (e) => {
    if (!(e.buttons & 2)) return;
    camYaw -= e.movementX * 0.006;
    camPitch = THREE.MathUtils.clamp(camPitch + e.movementY * 0.005, 0.06, 1.4);
  });
  addEventListener('wheel', (e) => { camDistance = THREE.MathUtils.clamp(camDistance + e.deltaY * 0.015, 6, 34); }, { passive: true });
}
function follow0() { queueMicrotask(() => follow.copy(player.position)); }
const clock = new THREE.Clock();
const look = new THREE.Vector3(), follow = new THREE.Vector3();
function frame() {
  const real = Math.min(clock.getDelta(), 0.05);
  if (boss) {
    boss.update(real);
    if (MAP && boss.ready && !boss.seen && Math.hypot(player.position.x - world.arena.x, player.position.z - world.arena.z) < 19) boss.start();
  }
  if (boss?.playing) { /* the player holds still during the intro */ } else if (stop > 0) stop -= real; else update(real);   // hit-stop freezes the action, not the camera shake
  shake = Math.max(0, shake - real);
  follow.lerp(player.position, 1 - Math.exp(-8 * real));
  if (keys.KeyQ) camYaw += real * 1.8;
  if (keys.KeyE) camYaw -= real * 1.8;
  look.copy(follow).setY(MAP ? follow.y + 2 : 1.1);
  if (MAP) {
    const flat = Math.cos(camPitch) * camDistance;
    camera.position.set(follow.x + Math.sin(camYaw) * flat, follow.y + 2 + Math.sin(camPitch) * camDistance, follow.z + Math.cos(camYaw) * flat);
  }
  else camera.position.set(follow.x, TOP ? 15 : 5, follow.z + (TOP ? 11.7 : 7.2));
  camera.position.x += (Math.random() - 0.5) * shake * 0.7;
  camera.position.y += (Math.random() - 0.5) * shake * 0.7;
  camera.lookAt(look);
  boss?.applyCamera(camera);
  composer.render();
  requestAnimationFrame(frame);
}
frame();

// Debug: render the current pose from a chosen camera position, returning an image.
function snap(x, y, z) {
  camera.position.set(player.position.x + x, y, player.position.z + z);
  camera.lookAt(player.position.x, 1.15, player.position.z);
  composer.render();
  return renderer.domElement;
}
if (MAP) boss = createBoss(scene, world.arena, { spawn, enemies });
